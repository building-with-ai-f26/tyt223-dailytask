          ${loginActions()}</div></div>`;
      }
      return head + friendsPage(today) + "</div>";
    }
    function sealedProfile(avatars, heroStats) {
      const perks = [["crown", "Pick your adventurer avatar"], ["sword", "Grow hero stats and earn badges"], ["trophy", "Unlock achievements and keep streaks"],
        ["clock", "Get quest reminders on your phone"], ["scroll", "Keep your quests on every device"]];
      const action = loginActions();
      return `<div class="page"><div class="board-head"><h2>Hero Profile</h2></div>
        <div class="panel sealed" style="margin-top:0">
          <div class="seal-wrap" aria-hidden="true"><div class="wax-seal">${px("crown", 38)}</div></div>
          <h3>Your hero journal is sealed</h3>
          <p class="sealed-sub">Log in to break the seal</p>
          <ul class="sealed-perks">${perks.map(([icon, text]) => `<li>${px(icon, 20)}${text}</li>`).join("")}</ul>
          ${action}
        </div>
        ${installPanel()}
        <div class="sealed-preview" aria-hidden="true" inert>
          <div class="panel" style="margin-top:0"><h3>Your avatar</h3><div class="avatars">${avatars}</div></div>
          <div class="panel"><h3>Hero stats</h3><div class="hero-stats">${heroStats}</div></div>
        </div></div>`;
    }

    // ---------- Home-screen app ----------
    let installPrompt = null;   // Android / desktop Chrome hand us this; iPhone never does
    function isInstalled() { return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true; }
    function isIphone() { return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
    const SHARE_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 11v9h14v-9"/></svg>';
    function isAndroid() { return /Android/i.test(navigator.userAgent); }
    const LIVE_APP_URL = "https://building-with-ai-f26.github.io/tyt223-dailytask/app/";
    // Profile panel: shown to everyone until DailyQuest is already running as an installed app.
    function installPanel() {
      if (isInstalled()) return `<div class="panel"><h3>App & reminders</h3>
        <p class="sync-line" style="margin:-4px 0 10px">${px("check", 14)}DailyQuest is on your home screen</p>
        ${reminderControls()}</div>`;
      return `<div class="panel"><h3>Get the app</h3>
        <p class="muted" style="margin:-4px 0 8px">Add DailyQuest to your phone's home screen. It opens full-screen like an app and works offline.</p>
        <p class="sync-line" style="margin:0 0 12px">${px("clock", 14)}Once it's on your home screen, you can turn on reminders: a summary at 8:00 AM and a nudge 30 minutes before quests with a time.</p>
        <button class="btn" data-action="install-help">${px("scroll", 16)} Add to Home Screen</button></div>`;
    }
    // The pop-up: steps for the device in hand first, the other phones folded underneath.
    function openInstallHelp() {
      const iphone = `<ol class="install-steps"><li>Open this page in <b>Safari</b></li><li>Tap the <b>Share</b> button ${SHARE_ICON} (at the bottom, or next to the address)</li><li>Scroll down and tap <b>Add to Home Screen</b></li><li>Tap <b>Add</b>. DailyQuest appears on your home screen</li></ol>`;
      const android = `<ol class="install-steps"><li>Open this page in <b>Chrome</b></li><li>Tap the <b>⋮</b> menu (top right)</li><li>Tap <b>Add to Home screen</b> or <b>Install app</b></li><li>Tap <b>Install</b> or <b>Add</b></li></ol>`;
      const link = `<div class="install-link"><input id="installUrl" readonly value="${esc(LIVE_APP_URL)}" aria-label="DailyQuest link" /><button type="button" class="btn soft" data-action="copy-app-link">Copy</button></div>`;
      const nativeBtn = installPrompt ? '<button class="btn" style="width:100%;margin-top:12px" data-action="install-app">Install now</button>' : "";
      let main, others;
      if (isIphone()) { main = "<h3>On your iPhone</h3>" + iphone; others = "<summary>Using an Android phone?</summary>" + android; }

            if (result) { lastCompletion = { snapshot }; completionToken++; }
            if (result) track("quest_completed", { kind: goal.days ? "repeating" : "weekly_goal", category: goal.category, difficulty: goal.difficulty, xp: result.xp, finished_week: result.finishesWeek });
            if (result) finishQuest(btn, result, !!(goal && goal.days), today, result.finishesWeek ? "Weekly goal complete!" : "");
            return;
          }
          case "claim": {
            const card = btn.closest(".item");
            if (!claimReward(state, id, today)) return;
            const r = state.rewards.find((x) => x.id === id);
            card.classList.add("claimed");
            floatText(btn, "-" + r.cost + " coins");
            track("reward_claimed", { cost: r.cost });
            burst(btn);
            renderPlayer();
            toast("Enjoy your " + r.name + "!", rewardArt(r));
            save();
            setTimeout(() => { render(); queueAchievements(today); }, 480);
            return;
          }
          case "buy-shield":
            if (!buyShield(state, today)) return;
            track("shield_bought", { held: state.shields });
            burst(btn);
            toast("Streak shield ready! It protects one missed day.", "shield");
            break;
          case "pick-avatar": {
            const pick = AVATARS.find((a) => a.id === btn.dataset.avatar);
            if (!pick || levelOf(state.lifetimeXp) < avatarUnlockLevel(pick.id)) return;
            state.avatar = pick.id;
            track("avatar_changed", { avatar: pick.id });
            toast("You're now " + pick.name + "!");
            if (!$("sheetOverlay").hidden) closeSheet();
            break;
          }
          case "badge-info": openBadgeInfo(Number(btn.dataset.level)); return;
          case "ach-info": openAchievementInfo(btn.dataset.ach); return;
          case "welcome-sample":
            track("welcome_choice", { choice: "sample" });
            closeSheet();
            break;
          case "welcome-fresh":
            track("welcome_choice", { choice: "fresh" });
            resetTo(newState());
            closeSheet();
            break;
          case "moment-next": nextMoment(); return;
          case "accept-suggestion": acceptSuggestion(); return;
          case "auth-open": case "auth-mode": openAuth(btn.dataset.mode); return;
          case "logout": logout(); return;
          case "forgot-current":
            if (account.client && account.user) account.client.auth.resetPasswordForEmail(account.user.email, { redirectTo: appUrl() })
              .then(({ error }) => authMessage(error ? friendlyAuthError(error) : "We emailed you a link to set a new password.", !error));
            return;
          case "install-help": openInstallHelp(); return;
          case "landmark-info": openLandmark(Number(btn.dataset.at)); return;
          case "paste-open": if (!account.user) { openAuth("login", "Log in to paste notes and let AI find your quests.", true); return; } openPaste(); return;
          case "paste-add": addPastedQuests(); return;
          case "paste-back": openPaste(pasteDraft.text); return;
          case "chronicle-write": writeChronicle(); return;
          case "buy-gear": {
            const g = GEAR.find((x) => x.id === btn.dataset.gear);
            if (!g || !buyGear(state, g.id)) return;
            track("gear_bought", { item: g.id, slot: g.slot, price: g.price });
            toast(`${g.slot === "title" ? "New title: " + g.name : g.name + " equipped"}!`, "gift");
            break;
          }
          case "equip-gear": {
            const g = GEAR.find((x) => x.id === btn.dataset.gear);
            if (!g || !equipGear(state, g.id)) return;
            track("gear_equipped", { item: g.id, on: gearOf(state)[g.slot] === g.id });
            break;
          }
          case "goto-week": tab = "week"; render(); window.scrollTo(0, 0); return;
          case "push-on": pushOn(); return;
          case "push-off": pushOff(); return;
          case "push-test": pushTest(); return;
          case "copy-app-link": {
            const box = $("installUrl");
            const done = () => toast("Link copied", "check");
            if (navigator.clipboard) navigator.clipboard.writeText(LIVE_APP_URL).then(done, () => { box.select(); document.execCommand("copy"); done(); });
            else { box.select(); document.execCommand("copy"); done(); }
            return;
          }
          case "install-app":
            if (installPrompt) { installPrompt.prompt(); installPrompt.userChoice.then((c) => { track("app_install_prompt", { outcome: c.outcome }); installPrompt = null; render(); }); }
            return;
          case "sync-cloud": closeSheet(); track("sync_choice", { choice: "account" }); applyCloud(account.cloudRow, "Loaded your quests from your account"); return;
          case "sync-local": closeSheet(); track("sync_choice", { choice: "browser" }); pushNow().then(() => toast("Saved this browser's quests to your account", "check")); return;
          case "use-template": {
            const t = allTemplates()[Number(btn.dataset.index)];
            if (t.text.includes("___")) { openTemplate(t); return; }
            addParsed(Object.assign(parseEntry("x", today), { name: t.text, category: t.category, difficulty: t.difficulty }), today, "template");
            break;
          }
          case "close-template": closeTemplate(); return;
          case "manage-templates": openTemplateManager(); return;
          case "delete-template":
            state.templates.splice(Number(btn.dataset.index), 1);
            save(); render(); openTemplateManager();
            return;
          case "close-sheet": closeSheet(); return;
          case "edit": openEdit(btn.dataset.kind, id); return;
          case "save-as-template": {
            const f = readEditForm();
            if (f.name) { state.templates.push({ text: f.name, category: f.category, difficulty: f.difficulty }); save(); render(); toast("Template saved"); }
            return;
          }
          case "delete-item":
            if (editing.kind === "goal") state.goals = state.goals.filter((g) => g.id !== editing.id);
            else {
              const gone = state.quests.find((q) => q.id === editing.id);
              if (gone && gone.autoKey) state.autoDismissed = (state.autoDismissed || []).concat(gone.autoKey).slice(-300);
              state.quests = state.quests.filter((q) => q.id !== editing.id);
            }
            closeSheet();
            break;
          case "mode": todayMode = btn.dataset.mode; tab = "today"; break;
          case "pmode": profileMode = btn.dataset.mode; tab = "profile"; break;
          case "undo-add":
            if (lastAdded) {
              if (lastAdded.kind === "goal") state.goals = state.goals.filter((g) => g.id !== lastAdded.id);
              else state.quests = state.quests.filter((q) => q.id !== lastAdded.id);
              lastAdded = null;
              $("confirmLine").hidden = true;
            }
            break;
          case "delete-reward": state.rewards = state.rewards.filter((r) => r.id !== id); break;
          case "import-ics": $("icsFile").click(); return;
          case "feed-add": if (!account.user) { openAuth("login", "Log in to connect a calendar. Events then keep updating on their own.", true); return; } openFeedForm(); return;
          case "feed-refresh": refreshFeed(btn.dataset.id); return;
          case "feed-remove": {
            const x = state.feeds.find((y) => y.id === btn.dataset.id);
            if (!x || !confirm(`Disconnect ${x.name}? Its events will be removed from DailyQuest (your real calendar isn't touched).`)) return;
            removeFeed(state, x.id);
            track("calendar_feed_removed");
            break;
          }
          case "import-holidays": importHolidays(btn); return;
          case "clear-events":
            if (!confirm("Remove all calendar events from the schedule?")) return;
            state.events = [];
            break;
          case "next-day": state.dayOffset += 1; toast("It's now " + short(getToday())); break;
          case "reset-sample":
            if (!confirm("Replace everything with the sample data?")) return;
            resetTo(sampleState(dateStr(new Date())));
            break;
          case "reset-empty":
            if (!confirm("Delete all quests, XP, rewards, and calendar events?")) return;
            resetTo(newState());
            break;
        }
        save();
        render();
      });

      document.addEventListener("submit", (e) => {
        e.preventDefault();
        if (e.target.id === "authForm") { submitAuth(); return; }
        if (e.target.id === "feedForm") { submitFeed(); return; }
        if (e.target.id === "pasteForm") { findPastedQuests(); return; }
        if (e.target.id === "heroForm") { submitHeroCard(); return; }
        if (e.target.id === "friendSearch") { findByCode(); return; }
        if (e.target.id === "feastForm") { submitFeast(); return; }
        const today = getToday();
        lastCompletion = null;
        if (e.target.id === "captureForm") {
          const value = input().value;
          if (!value.trim()) return;
          addParsed(currentEntry(), today, Object.keys(pvOverrides).length ? "typed_edited" : "typed");
          pvOverrides = {};
          input().value = "";
          updatePreview();
          updateSuggestion();
        } else if (e.target.id === "templateForm") {
          const blank = $("templateBlank").value;
          if (!blank.trim()) return;
          addParsed(fromTemplate(activeTemplate, blank, today), today, "template");
          closeTemplate();
        } else if (e.target.id === "editForm") {
          const f = readEditForm();
          if (!f.name) return;
          applyEdit(state, editing.kind, editing.id, f, today);
          closeSheet();
        } else if (e.target.id === "newTemplateForm") {
          state.templates.push({ text: $("tText").value.trim(), category: $("tCategory").value, difficulty: $("tDifficulty").value });
          save(); render(); openTemplateManager();
          return;
        } else if (e.target.id === "rewardForm") {
          addReward(state, $("rName").value.trim(), Number($("rCost").value));
        }
        save();
        render();
      });

      document.addEventListener("input", (e) => {
        if (e.target.id === "captureInput") { updatePreview(); updateSuggestion(); }
        if (e.target.dataset.pv === "name") pvOverrides.name = e.target.value;   // no re-render, so typing keeps focus
      });
      document.addEventListener("change", (e) => {
        const pv = e.target.dataset.pv;
        if (pv && pv !== "name") {
          pvOverrides[pv] = e.target.value;
          if (pv === "repeat" && e.target.value === "custom") delete pvOverrides.repeat;
          updatePreview();
          const again = document.querySelector(`[data-pv="${pv}"]`);
          if (again) again.focus();
          return;
        }
        if (e.target.dataset.reschedDate) {
          const id = Number(e.target.dataset.reschedDate), today = getToday();
          if (rescheduleQuest(state, id, e.target.value, today)) {
            const q = state.quests.find((x) => x.id === id);
            reschedFor = null;
            track("quest_rescheduled", { when: "pick", overdue: false });
            save(); render();
            toast("Moved to " + relative(q.day, today), "calendar");
          }
          return;
        }
        if (e.target.dataset && e.target.dataset.social === "feasts") { setFeastsOpen(e.target.checked); return; }
        if (e.target.name === "ffriend") { updateFeastSend(); return; }
        if (e.target.dataset && e.target.dataset.feedQuests) { setFeedQuests(e.target.dataset.feedQuests, e.target.checked); return; }
        if (e.target.id === "themeSelect") { state.theme = e.target.value; save(); render(); }
        if (e.target.id === "eRepeat") $("eDays").hidden = e.target.value !== "days";
        if (e.target.id === "icsFile" && e.target.files[0]) {
          const reader = new FileReader();
          reader.onload = () => {
            const today = getToday();
            const events = parseIcs(String(reader.result), today);
            mergeEvents(state, events);
            track("calendar_imported", { events: events.length });
            const saved = save();
            render();
            const todayCount = events.filter((ev) => occursOn(ev, today)).length;
            toast(!events.length ? "No upcoming events found in that file" : saved
              ? "Imported " + events.length + " events (" + todayCount + " today)"
              : "Imported, but the calendar was too big to save for next time");
          };
          reader.onerror = () => toast("Couldn't read that file");
          reader.readAsText(e.target.files[0]);
          e.target.value = "";
        }
      });

      // Typing anywhere goes straight to the quick-add bar, on any tab.
      document.addEventListener("keydown", (e) => {
        // Smart compose: Tab (or the right arrow at the end of the text) accepts the faint suggestion.
        if (e.target.id === "captureInput" && suggestion && !e.shiftKey && (e.key === "Tab" || (e.key === "ArrowRight" && e.target.selectionStart === e.target.value.length))) {
          e.preventDefault();
          acceptSuggestion();
          return;
        }
        if (e.target.id === "captureInput" && e.key === "Escape" && suggestion) { showSuggestion(null); return; }
        if (e.key === "Enter" && e.target.dataset && e.target.dataset.pv) {   // Enter in a preview field saves too
          e.preventDefault();
          if (e.target.value !== "custom") pvOverrides[e.target.dataset.pv] = e.target.value;
          $("captureForm").requestSubmit();
          return;
        }
        if (e.key === "Escape") {
          if (!$("sheetOverlay").hidden) closeSheet();
          else if (!$("templateForm").hidden) closeTemplate();
          return;
        }
        if (modalOpen() || e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1 || e.key === " ") return;
        if (e.target.matches("input, select, textarea")) return;
        if (tab !== "today") { tab = "today"; render(); }
        input().focus();
      });
      window.addEventListener("focus", focusCapture);
      document.addEventListener("pointerdown", swipeStart);
      document.addEventListener("pointermove", swipeMove);
      document.addEventListener("pointerup", swipeEnd);
      document.addEventListener("pointercancel", swipeCancel);
      document.addEventListener("click", (e) => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; } }, true);   // a swipe isn't a tap
      input().addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== input()) $("ghost").innerHTML = ""; }, 200));
      input().addEventListener("focus", () => { if (input().value) updateSuggestion(); });
      detectAi();
      // A mouse wheel scrolls the template row sideways.
      $("chips").addEventListener("wheel", (e) => {
        if (e.deltaY) { $("chips").scrollLeft += e.deltaY; e.preventDefault(); }
      }, { passive: false });

      render();
      const backFromLogin = /[?&](code|error_description)=|access_token=/.test(location.search + location.hash);
      if (firstVisit && !backFromLogin) openWelcome();
      initAccounts();
      // Home-screen app: keep a copy for offline use (needs https or localhost; skipped when opened as a file).
      if ("serviceWorker" in navigator && (location.protocol === "https:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
        navigator.serviceWorker.register("sw.js").catch(() => { /* the app still works online */ });
      }
      window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installPrompt = e; if (tab === "profile") render(); });
      window.addEventListener("appinstalled", () => { installPrompt = null; track("app_installed"); });
      if (isInstalled()) track("opened_as_app");
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { refreshFromCloud(); refreshDueFeeds(FEED_OPEN_AGE); loadSocial(5 * 60 * 1000); } });
      setInterval(() => refreshDueFeeds(FEED_BACKGROUND_AGE), 15 * 60 * 1000);
      window.addEventListener("online", () => { if (account.user && readMeta().pending) pushNow(); });
    }
  </script>
</body>
</html>
